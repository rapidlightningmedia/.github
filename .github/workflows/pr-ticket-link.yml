name: PR ticket link

# The shared PR-to-ticket check (rlm-ops#558). Every repo that delivers ticket work calls this
# file from a short caller, so the rule lives in ONE place and the next rule change is one edit.
# famlybot, rlm-lib and client-portal each carried a full copy until rlm-ops#558; those copies
# are how the old one-ticket rule outlived JD's ruling.
#
# The rule (JD, 09/10/2026-Thu): a PR attaches to every ticket it delivers. So a PR must link
# ONE OR MORE tickets. Zero fails. More than one passes.
#
# A merge never closes a ticket: "Auto-close issues with merged linked pull requests" is off in
# every ticket repo (JD, 09/11/2026-Fri, rlm-ops#586). The `Closes` keyword is kept only because
# it is the link.
#
# It reads the RESOLVED closingIssuesReferences field from the API and never greps the PR body,
# so it verifies that GitHub actually linked the ticket instead of trusting that the text looked
# right. "Ticket: #25" is a mention, not a link, and a keyword inside backticks resolves to nothing.
#
# Cross-repo tickets (famlybot#82): the caller's GITHUB_TOKEN is repo-scoped and cannot see private
# issues in another repo, so a PR that links owner/repo#N elsewhere reads as zero under it. On a
# zero, we mint an org-scoped token from the rlm-board-cascade GitHub App and resolve the SAME field
# again. Same-repo PRs (the common case) never mint, so they carry no dependency on the App key.
#
# This repo is PUBLIC, so this file is public. It holds no secrets. The App's client id below is
# public (GET /apps/rlm-board-cascade returns it with no login), so it lives here, and each repo
# needs ONE secret: BOARD_CASCADE_APP_PRIVATE_KEY. (JD's ruling, 09/10/2026-Thu, rlm-ops#558: the
# client id replaced the deprecated app-id input and the BOARD_CASCADE_APP_ID secret.) Callers pass
# ONLY the key, by name. Never `secrets: inherit`: it hands EVERY secret in the caller's repo (cloud
# keys, package tokens) to this public workflow, which needs just the one (JD's ruling, rlm-ops#558).
# The org is on GitHub Free, where private repos cannot read org-level secrets, so the key is set
# per repo. A repo without it passes an empty value, still passes same-repo PRs, and fails a
# cross-repo close with an error that names the secret.
#
# It cannot be a REQUIRED check: GitHub Free blocks branch protection and rulesets on private
# repos. A red run does not block a merge; the /execute green gate and /review are what stop one.
#
# ADRs (rlm-shared): decisions/board/2026-07-21-pr-ticket-linking-closing-keyword.md (and its
# 09/10/2026 amendment), 2026-07-31-pr-ticket-check-cross-repo-visibility.md, and
# 2026-09-11-merges-never-close-tickets.md.
#
# The caller - the whole of .github/workflows/pr-ticket-link.yml in each repo:
#
#   name: PR ticket link
#   on:
#     pull_request:
#       types: [opened, edited, reopened, synchronize]
#   permissions:
#     contents: read
#     pull-requests: read
#     issues: read
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     ticket-link:
#       uses: rapidlightningmedia/.github/.github/workflows/pr-ticket-link.yml@main
#       # Pass ONLY the App key, by name. Never `secrets: inherit`.
#       secrets:
#         BOARD_CASCADE_APP_PRIVATE_KEY: ${{ secrets.BOARD_CASCADE_APP_PRIVATE_KEY }}
#
# The check reports as "ticket-link / PR links a ticket".

on:
  workflow_call:
    secrets:
      BOARD_CASCADE_APP_PRIVATE_KEY:
        description: The rlm-board-cascade App private key. Needed only when a PR links a ticket in another repo.
        required: false

jobs:
  ticket-link:
    name: PR links a ticket
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    # Bot PRs (Dependabot) have no ticket and must not acquire one. Exempt by author, never by an
    # opt-out label, so the exemption cannot be borrowed by a human PR.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Resolve visible linked tickets
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$PR" ]; then
            echo "::error::The PR ticket check only works on a pull request. Call it from an 'on: pull_request' trigger."
            exit 1
          fi

          # closingIssuesReferences the repo-scoped token can see. Same-repo tickets always land
          # here; a ticket in another private repo is invisible to this token and comes back empty.
          tickets=$(gh pr view "$PR" --repo "$REPO" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[] | "\(.repository.owner.login)/\(.repository.name)#\(.number)"')

          count=$(printf '%s' "$tickets" | grep -c . || true)

          if [ "$count" -ge 1 ]; then
            # One or more is the rule. Tickets in other private repos are not listed here, because
            # this token cannot see them and the App token is only minted on a zero.
            {
              echo "This PR links $count ticket(s) in this repo:"
              printf '%s\n' "$tickets" | while read -r t; do echo "- $t"; done
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "cross_repo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Zero visible references: either the PR links nothing, or it links a ticket in a repo
          # this token cannot see. The org-scoped steps below tell them apart.
          echo "cross_repo=true" >> "$GITHUB_OUTPUT"

      - name: Check the App secret is set
        if: steps.resolve.outputs.cross_repo == 'true'
        env:
          APP_KEY: ${{ secrets.BOARD_CASCADE_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Fail closed, with a message that says which of the two cases this might be. A missing
          # secret, or a fork PR (the pull_request trigger withholds secrets from forks), lands here.
          if [ -z "$APP_KEY" ]; then
            echo "::error::This PR links no ticket that this repo can see. If it links no ticket at all, put 'Closes #N' on the FIRST line of the PR description. If it links a ticket in ANOTHER repo ('Closes owner/repo#N'), the check needs the BOARD_CASCADE_APP_PRIVATE_KEY secret to see that ticket, and $REPO does not have it. Set it on this repo (JD's hands), then re-run this check."
            exit 1
          fi

      - name: Mint an org-scoped token for cross-repo resolution
        id: mint
        if: steps.resolve.outputs.cross_repo == 'true'
        uses: actions/create-github-app-token@v3
        with:
          # The rlm-board-cascade App's client id. Public by design: `gh api /apps/rlm-board-cascade`
          # returns it with no login. Only the private key is a secret.
          client-id: Iv23liYQpQkGrus2Q6Yc
          private-key: ${{ secrets.BOARD_CASCADE_APP_PRIVATE_KEY }}
          # No `repositories:` -> the token can read every repo the App is installed on in this org,
          # so it sees both this PR and the ticket's repo. Resolving the closing reference needs the
          # App's Pull requests:Read (the PR side) and Issues:Read (the ticket side).
          owner: ${{ github.repository_owner }}
          # Least scope. The App also holds Issues:Write and Projects:Write for board-cascade; without
          # these two lines the minted token would carry them too. The check only reads.
          permission-issues: read
          permission-pull-requests: read

      - name: Resolve cross-repo linked tickets
        if: steps.resolve.outputs.cross_repo == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The same resolved-reference query, now with a token that can see the other repo. An
          # empty result here means GitHub resolved no link at all - a bare mention, or a typo'd
          # or backtick-disabled reference - so the PR links nothing.
          tickets=$(gh pr view "$PR" --repo "$REPO" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[] | "\(.repository.owner.login)/\(.repository.name)#\(.number)"')

          count=$(printf '%s' "$tickets" | grep -c . || true)

          if [ "$count" -eq 0 ]; then
            echo "::error::This PR links no ticket. Put 'Closes #N' on the FIRST line of the PR description, or 'Closes owner/repo#N' if the ticket lives in another repo. Add one line for each ticket the PR delivers. The keyword makes the link; a merge does not close the ticket. A line like 'Ticket: #N' is only a mention and makes no link."
            exit 1
          fi

          {
            echo "This PR links $count ticket(s):"
            printf '%s\n' "$tickets" | while read -r t; do echo "- $t"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
