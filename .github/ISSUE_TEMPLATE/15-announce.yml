# Generated from the ruled ticket-template spec (rlm-ops#484, rlm-ops#786). Edit the spec, then this file, in the same motion.
name: Announce
description: 'The announce station. Tell the client and the public what shipped.'
type: Announce
projects:
- rapidlightningmedia/11
body:
- type: markdown
  attributes:
    value: |-
      **How to write this ticket** (the full rules: `rlm-shared://_templates/tickets/ticket-templates.md`)

      - Plain, simple English. Short sentences. One idea per sentence. Write for a person who opens this cold.
      - Do not condense. Three facts are three sentences.
      - A new idea starts a new paragraph. A blank line between paragraphs.
      - Name a ticket as a full link: `[rlm-ops#448](https://github.com/rapidlightningmedia/rlm-ops/issues/448)`. Never a bare number.
      - Dates as `09/02/2026-Wed`. Quotes as `"..." (JD: 09/02/2026-Wed)`. Share files as `rlm-shared://path`.
      - Tables and lists, liberally. Number every item someone may refer to later (A1, A2...).
      - Do not invent a fact. Write "not known at birth" instead.
      - Full tier only. A Plan tier or an Ops tier gets no Announce ticket, because it is internal work and there is no one outside to tell.
- type: textarea
  id: announce
  attributes:
    label: Announce
    description: What shipped, and who hears about it.
  validations:
    required: true
- type: textarea
  id: audience
  attributes:
    label: Audience
    description: 'A table: who is told, who tells them, and where. Client and public are the two standing rows.'
    value: |
      | Who is told | Who tells them | Where |
      |---|---|---|
      | Client | Account Manager |  |
      | Public | Marketing and Sales | website, App Store listing, channels |
  validations:
    required: true
- type: textarea
  id: timing
  attributes:
    label: Timing
    description: 'The timing in words: what has to happen first, what waits on this, and how the timing should run. Name the tickets that affect it and say how.'
  validations:
    required: true
- type: checkboxes
  id: artifact-checklist
  attributes:
    label: Artifact Checklist
    description: Tick each artifact as it lands. The paths go in a comment.
    options:
    - label: A1 Release Note
    - label: A2 Version
- type: textarea
  id: supporting-material
  attributes:
    label: Supporting Material
    description: A table. One row per file, transcript, mockup or document that supports this ticket. Number them SM1, SM2... Share files as `rlm-shared://path`. Write `None` in the first row if there is nothing.
    value: |
      | ID | Description | Location |
      |---|---|---|
      | SM1 |  |  |
  validations:
    required: true
- type: textarea
  id: origin
  attributes:
    label: Origin
    description: 'One line: **Requested by** *person* **on** *date* **@** *circumstance*. Who asked for this, when, and where.'
    placeholder: Requested by JD on 09/08/2026-Tue @ the product meeting
  validations:
    required: true
- type: textarea
  id: related-tickets
  attributes:
    label: Related Tickets
    description: A table. Every ticket this one relates to, as a full link, with the relationship in words (Parent, Origin ticket, Sibling, Blocks, Where Phase 3 lives...). Do not list children or Blocked By edges - the board shows those. Write `None` in the first row if there is nothing.
    value: |
      | Relationship | Ticket | Description |
      |---|---|---|
      |  |  |  |
  validations:
    required: true
